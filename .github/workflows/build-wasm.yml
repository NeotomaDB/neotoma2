name: Build WASM and Deploy

on:
  push:
    branches: [webr]

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout package source
        uses: actions/checkout@v3

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Set up Emscripten SDK
        run: |
          sudo apt update
          sudo apt install -y cmake python3-pip
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
      
          # Fix permissions and export environment variables
          chmod +x emsdk_env.sh
          ./emsdk_env.sh > ../emsdk_env_tmp.sh
          grep "^export " ../emsdk_env_tmp.sh | sed 's/^export //' >> $GITHUB_ENV
          
      - name: Install webr package
        run: |
          dir.create(Sys.getenv("R_LIBS_USER"), recursive = TRUE, showWarnings = FALSE)
          install.packages("webr", lib = Sys.getenv("R_LIBS_USER"),
                           repos = c("https://repo.r-wasm.org", "https://cloud.r-project.org"))
        shell: Rscript {0}
  
      - name: Build WebR-compatible binary
        run: |
          dir.create("wasm", showWarnings = FALSE)
          webr::wasmify(".", output_dir = "wasm")
        shell: Rscript {0}

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-package
          path: wasm/