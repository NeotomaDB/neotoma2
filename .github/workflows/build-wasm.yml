name: Build WASM and Deploy

on:
  push:
    branches: [webr]

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout package source
        uses: actions/checkout@v3

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Set up Emscripten SDK
        run: |
          sudo apt update
          sudo apt install -y cmake python3-pip
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
      
          # Fix permissions and export environment variables
          chmod +x emsdk_env.sh
          ./emsdk_env.sh > ../emsdk_env_tmp.sh
          grep "^export " ../emsdk_env_tmp.sh | sed 's/^export //' >> $GITHUB_ENV
          
      - name: Install webr package
        run: |
          install.packages("webr", repos = "https://repo.r-wasm.org")
        shell: Rscript {0}
  
      - name: Build WASM binary
        run: |
          mkdir -p wasm
          Rscript -e 'webr::wasmify(".", output_dir = "wasm")'

      - name: Push to target gh-pages branch
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git clone --branch gh-pages https://x-access-token:${{ secrets.TARGET_REPO_PAT }}@github.com/YOUR-USERNAME/trial.git out
          rm -rf out/wasm
          cp -r wasm out/wasm
          cd out
          git add wasm
          git commit -m "Update WASM build from neotoma2"
          git push origin gh-pages