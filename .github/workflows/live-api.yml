# Weekly check that the public Neotoma API still behaves the way the package
# expects. It runs only the small, fast smoke tests in
# tests/testthat/test_live_smoke.R (a few requests, a couple of seconds), so it
# adds no meaningful load to production. The heavy live tests run against
# api-dev in the test-coverage workflow instead.
#
# Run it by hand from the Actions tab ("Run workflow") and choose the server.
name: live-api

on:
  schedule:
    # Mondays, 14:00 UTC.
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      server:
        description: "API server to test"
        type: choice
        options: [neotoma, dev]
        default: neotoma

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      # Scheduled runs have no inputs, so they test production ("neotoma").
      APIPOINT: ${{ inputs.server || 'neotoma' }}
      NEOTOMA_TIMEOUT: 30
      NEOTOMA_RETRIES: 2

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools

      - name: Smoke tests against ${{ env.APIPOINT }}
        run: |
          devtools::load_all(".")
          testthat::test_file(
            "tests/testthat/test_live_smoke.R",
            reporter = "summary", stop_on_failure = TRUE
          )
        shell: Rscript {0}
