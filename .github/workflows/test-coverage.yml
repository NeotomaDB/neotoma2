# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [production, dev]
  pull_request:
    branches: [production, dev]

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-latest

    # NOT_CRAN must stay true here: covr measures coverage by executing the
    # tests, so skip_on_cran() has to be a no-op or only the two offline test
    # files would run. That means this job does hit the live Neotoma API and is
    # inherently slow -- the cap stops it occupying a runner for GitHub's
    # default 6 hours when the API is slow or unreachable.
    timeout-minutes: 60

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      # Bound each request so an unresponsive API fails instead of hanging.
      # Kept generous enough for the genuinely slow queries (wildcard site
      # searches, large downloads) that this suite makes when the API is well.
      NEOTOMA_TIMEOUT: 30
      NEOTOMA_RETRIES: 2

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::xml2
            any::covr
      
      - name: Test coverage
        run: |
          covr::codecov(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(Sys.getenv("RUNNER_TEMP"), "package")
          )
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find ${{ runner.temp }}/package -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
